---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Install OS packages
  ansible.builtin.apt:
    name:
      - python3
      - python3-rpi.gpio
      - wkhtmltopdf
      - fonts-noto-cjk
      - ufw
      - rsync
      - fail2ban
    state: present
    cache_valid_time: 3600
  become: true

- name: Generate locale en_US.UTF-8
  community.general.locale_gen:
    name: en_US.UTF-8
    state: present
  become: true

- name: Generate locale de_CH.UTF-8
  community.general.locale_gen:
    name: de_CH.UTF-8
    state: present
  become: true

- name: Set default locale
  ansible.builtin.copy:
    dest: /etc/default/locale
    content: "LANG=en_US.UTF-8\n"
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Set timezone
  community.general.timezone:
    name: "{{ base_locale_timezone }}"
  become: true

- name: Harden SSH — disable password auth
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PasswordAuthentication"
    line: "PasswordAuthentication no"
    validate: "sshd -t -f %s"
  notify: Restart sshd
  become: true

- name: Harden SSH — disable root login
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PermitRootLogin"
    line: "PermitRootLogin no"
    validate: "sshd -t -f %s"
  notify: Restart sshd
  become: true

- name: Harden SSH — enable public key auth
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PubkeyAuthentication"
    line: "PubkeyAuthentication yes"
    validate: "sshd -t -f %s"
  notify: Restart sshd
  become: true

- name: Allow SSH through UFW
  community.general.ufw:
    rule: allow
    name: OpenSSH
  become: true

- name: Enable UFW
  community.general.ufw:
    state: enabled
    policy: deny
  become: true

- name: Deploy fail2ban SSH jail config
  ansible.builtin.template:
    src: fail2ban_sshd.conf.j2
    dest: /etc/fail2ban/jail.d/sshd.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart fail2ban
  become: true

- name: Enable and start fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    enabled: true
    state: started
    daemon_reload: true
  become: true

- name: Create waveshare vendor directory
  ansible.builtin.file:
    path: "{{ inksink_vendor_dir }}"
    state: directory
    owner: pi
    group: pi
    mode: "0755"
  become: true

- name: Synchronize waveshare vendor
  ansible.posix.synchronize:
    src: "{{ playbook_dir }}/../../vendor/waveshare_epd/"
    dest: "{{ inksink_vendor_dir }}/waveshare_epd/"
    delete: true

- name: Set ownership of waveshare vendor
  ansible.builtin.file:
    path: "{{ inksink_vendor_dir }}"
    owner: pi
    group: pi
    recurse: true
  become: true
