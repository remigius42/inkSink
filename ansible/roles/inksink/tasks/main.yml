---
- name: Ensure inksink directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: pi
    group: pi
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ inksink_dest_dir }}", mode: "0755"}
    - {path: "{{ inksink_config_dir }}", mode: "0755"}
    - {path: /var/lib/inksink, mode: "0750"}
  become: true

- name: Synchronize inksink source
  ansible.posix.synchronize:
    src: "{{ inksink_src_dir }}/"
    dest: "{{ inksink_dest_dir }}/"
    delete: true
    rsync_opts:
      - "--exclude=__pycache__"
      - "--exclude=*.pyc"
  notify:
    - Restart inksink

- name: Set ownership of inksink source
  ansible.builtin.file:
    path: "{{ inksink_dest_dir }}"
    owner: pi
    group: pi
    recurse: true
  become: true

- name: Template config file
  ansible.builtin.template:
    src: config.yml.j2
    dest: "{{ inksink_config_dir }}/config.yml"
    owner: pi
    group: pi
    mode: "0640"
  notify:
    - Restart inksink
  become: true

- name: Install shell wrapper
  ansible.builtin.template:
    src: inksink.j2
    dest: "{{ inksink_wrapper }}"
    owner: root
    group: root
    mode: "0755"
  notify:
    - Restart inksink
  become: true

- name: Create app virtualenv
  ansible.builtin.command:
    cmd: python3 -m venv {{ inksink_venv_dir }}
    creates: "{{ inksink_venv_dir }}/bin/python3"
  become: true

- name: Set ownership of virtualenv
  ansible.builtin.file:
    path: "{{ inksink_venv_dir }}"
    owner: pi
    group: pi
    recurse: true
  become: true

- name: Install Python dependencies into virtualenv
  ansible.builtin.pip:
    name:
      - "anki==25.9.4"
      - "smbus2>=0.6.1,<0.7"
      - Pillow
      - PyYAML
      - Jinja2
      - requests
    state: present
    virtualenv: "{{ inksink_venv_dir }}"
    virtualenv_python: python3
  become: true
  become_user: pi

- name: Install systemd service unit
  ansible.builtin.template:
    src: inksink.service.j2
    dest: /etc/systemd/system/inksink.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart inksink
  become: true

- name: Enable and start inksink service
  ansible.builtin.systemd:
    name: "{{ inksink_service }}"
    enabled: true
    state: started
    daemon_reload: true
  become: true
