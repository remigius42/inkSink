---
- name: Verify inksink device state
  hosts: all
  tasks:
    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Assert required packages are installed
      ansible.builtin.package_facts:
        manager: apt

    - name: Fail if required packages missing
      ansible.builtin.assert:
        that: item in ansible_facts.packages
        fail_msg: "Package not installed: {{ item }}"
      loop:
        - python3
        - python3-rpi.gpio
        - wkhtmltopdf
        - fonts-noto-cjk
        - ufw
        - rsync
        - fail2ban

    - name: Assert smbus2 is importable from virtualenv
      ansible.builtin.command:
        cmd: "{{ inksink_venv_dir }}/bin/python3 -c 'import smbus2'"
      changed_when: false

    - name: Assert waveshare driver is importable
      ansible.builtin.command:
        cmd: >-
          {{ inksink_venv_dir }}/bin/python3
          -c "from waveshare_epd import epd7in5_V2"
      environment:
        PYTHONPATH: "{{ inksink_vendor_dir }}"
      changed_when: false

    - name: Fail if fail2ban not running or not enabled
      ansible.builtin.assert:
        that:
          - "'fail2ban.service' in ansible_facts.services"
          - "ansible_facts.services['fail2ban.service'].state == 'running'"
          - "ansible_facts.services['fail2ban.service'].status == 'enabled'"
        fail_msg: "fail2ban is not running or not enabled"

    - name: Assert inksink source directory exists
      ansible.builtin.stat:
        path: "{{ inksink_dest_dir }}"
      register: inksink_dir

    - name: Fail if inksink source directory missing
      ansible.builtin.assert:
        that: inksink_dir.stat.isdir is defined and inksink_dir.stat.isdir

    - name: Assert config file exists
      ansible.builtin.stat:
        path: "{{ inksink_config_dir }}/config.yml"
      register: config_file

    - name: Fail if config file missing
      ansible.builtin.assert:
        that: config_file.stat.exists

    - name: Read config file content
      ansible.builtin.slurp:
        src: "{{ inksink_config_dir }}/config.yml"
      register: config_content
      no_log: true

    - name: Fail if config missing apps.anki structure
      ansible.builtin.assert:
        that: >
          (config_content.content | b64decode | from_yaml).apps.anki is defined
        fail_msg: "config.yml missing apps.anki structure"
      no_log: true

    - name: Fail if ankiweb_username not set in config
      ansible.builtin.assert:
        that: >
          (config_content.content | b64decode | from_yaml).apps.anki.ankiweb_username | default('') | trim | length > 0
        fail_msg: "config.yml missing apps.anki.ankiweb_username"
      no_log: true

    - name: Fail if ankiweb_password not set in config
      ansible.builtin.assert:
        that: >
          (config_content.content | b64decode | from_yaml).apps.anki.ankiweb_password | default('') | trim | length > 0
        fail_msg: "config.yml missing apps.anki.ankiweb_password"
      no_log: true

    - name: Assert collection data directory exists with correct permissions
      ansible.builtin.file:
        path: /var/lib/inksink
        state: directory
        mode: "0750"
      check_mode: true
      register: collection_dir_check

    - name: Fail if collection directory not present or not writable
      ansible.builtin.assert:
        that: not collection_dir_check.changed
        fail_msg: "/var/lib/inksink is missing or has wrong permissions"

    - name: Assert shell wrapper exists
      ansible.builtin.stat:
        path: "{{ inksink_wrapper }}"
      register: wrapper

    - name: Fail if shell wrapper missing
      ansible.builtin.assert:
        that: wrapper.stat.exists

    - name: Fail if inksink service not running or not enabled
      ansible.builtin.assert:
        that:
          - (inksink_service + '.service') in ansible_facts.services
          - ansible_facts.services[inksink_service + '.service'].state == 'running'
          - ansible_facts.services[inksink_service + '.service'].status == 'enabled'

    - name: Read systemd service unit file
      ansible.builtin.slurp:
        src: "/etc/systemd/system/{{ inksink_service }}.service"
      register: service_unit

    - name: Fail if INKSINK_VERSION not set in service unit
      ansible.builtin.assert:
        that: >
          (service_unit.content | b64decode) is search('Environment=INKSINK_VERSION=\S+')
        fail_msg: >
          INKSINK_VERSION is not set or empty in the systemd service unit;
          required by version_info() on the Status screen
