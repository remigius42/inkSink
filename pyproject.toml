# spellchecker:ignore numpy pydocstyle

[project]
name = "inksink"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "Pillow",
    "PyYAML>=6.0,<7.0",
    "Jinja2>=3.0",
    "requests",
    "smbus2>=0.6.1,<0.7",
    "anki==25.9.4",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-mock",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py313"]
exclude = "vendor/"

[tool.ruff]
line-length = 88
target-version = "py313"
exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "D"]  # pycodestyle, pyflakes, isort, pydocstyle
ignore = [
    "D100", "D101", "D102", "D103", "D104", "D105", "D106",  # missing-docstring rules not enforced by Codacy/Prospector
    "D203",  # conflicts with black (black enforces D211: no blank line before class docstring)
    "D213",  # conflicts with D212 — using D212 (summary on first line)
]

[tool.pydocstyle]
ignore = [
    "D203",  # conflicts with black (D211)
    "D213",  # conflicts with D212 — using D212
    "D406",  # not using numpy style
    "D407",  # not using numpy style
]

[tool.bandit.assert_used]
skips = ["*/test_*.py"]

[tool.pyright]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
exclude = ["vendor"]
reportMissingModuleSource = false
